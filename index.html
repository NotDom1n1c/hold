<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HOLD</title>
<meta name="description" content="Press. Hold. Let go.">
<meta name="theme-color" content="#04060d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04060d; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

  .hud { position: fixed; inset: 0; pointer-events: none; color: #fff; font: 400 14px/1.3 "IBM Plex Mono", Consolas, monospace; text-shadow: 0 1px 8px rgba(0, 0, 0, .8); z-index: 2; }

  #big {
    position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%);
    font: 400 clamp(84px, 24vh, 260px)/1 Anton, Impact, sans-serif; letter-spacing: .02em; white-space: nowrap;
    /* no blurred shadow here: re-drawing a blur this size stalled the browser for 350 ms at every blast */
    color: #fff; text-shadow: 0 .03em 0 rgba(0, 0, 0, .5); will-change: transform, opacity;
    transition: opacity .28s ease, transform .28s ease;
  }
  #big.off { opacity: 0; transform: translate(-50%, -50%) scale(1.12); }
  #big.punch { animation: punch .55s cubic-bezier(.12, .9, .25, 1) both; }
  @keyframes punch { from { transform: translate(-50%, -50%) scale(1.7); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }

  .read { position: absolute; left: clamp(18px, 3vw, 44px); top: clamp(16px, 3.2vh, 38px); }
  #energy { font: 400 clamp(38px, 7vh, 72px)/1.05 Anton, Impact, sans-serif; letter-spacing: .01em; font-variant-numeric: tabular-nums; }
  #energy sup { font-size: .55em; line-height: 0; }
  #energy small { font-size: .5em; margin-left: .18em; opacity: .85; }
  .target { margin-top: 4px; opacity: .92; font-size: clamp(13px, 1.9vh, 16px); }
  .target b { font-weight: 600; }

  .meter { position: absolute; left: 50%; bottom: clamp(26px, 5.4vh, 56px); transform: translateX(-50%); width: min(620px, 78vw); height: 6px; background: rgba(255, 255, 255, .17); }
  #fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #fff; box-shadow: 0 0 14px currentColor; }
  #tick { position: absolute; top: -8px; bottom: -8px; width: 2px; background: #fff; left: 58.8%; }
  #tick::after { content: "enough"; position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 12px; opacity: .9; }

  #msg { position: absolute; left: 50%; bottom: clamp(52px, 11vh, 110px); transform: translateX(-50%); width: min(720px, 90vw); font-size: clamp(14px, 2vh, 17px); text-align: center; transition: opacity .3s; }

  .corner { position: absolute; right: clamp(14px, 2.4vw, 34px); top: clamp(14px, 2.6vh, 30px); display: flex; gap: 8px; pointer-events: auto; }
  button {
    appearance: none; background: rgba(4, 6, 13, .55); border: 1px solid rgba(255, 255, 255, .34); color: #fff; cursor: pointer;
    font: 400 13px/1 "IBM Plex Mono", Consolas, monospace; padding: 8px 12px;
  }
  button:hover { background: rgba(255, 255, 255, .16); }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  #again { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); pointer-events: auto; font-size: 16px; padding: 13px 26px; display: none; }
  body.end #again { display: block; }
  body.end .meter, body.end .read { opacity: 0; }

  @media (max-width: 560px) { #tick::after { display: none; } }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="A moonscape with a mountain on the horizon. Press and hold to charge energy, let go to fire."></canvas>
<div class="hud">
  <div class="read">
    <div id="energy">0<small>J</small></div>
    <div class="target">Target: <b id="tname">Mountain</b> <span id="tneed"></span></div>
  </div>
  <div id="big">HOLD</div>
  <div id="msg">Mouse, finger or space. Then let go. Contains bright flashes.</div>
  <div class="meter"><div id="fill"></div><div id="tick"></div></div>
  <div class="corner"><button id="mute" aria-pressed="false">Sound on</button></div>
  <button id="again">Again</button>
</div>
<script src="app.js?v=8"></script>
</body>
</html>
